# Public application: serve the same build, but make the admin application
# and its APIs undiscoverable from this hostname.
server {
    listen 443 ssl http2;
    server_name app.example.com;
    root /var/www/mira/dist;
    client_max_body_size 3g;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;

    location ^~ /admin { return 404; }
    location ^~ /api/admin { return 404; }

    location ^~ /api/ {
        proxy_pass http://mira_api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Administration hostname: expose authentication and administrator APIs only.
# Express still validates the signed session and database-backed admin role.
server {
    listen 443 ssl http2;
    server_name admin.example.com;
    root /var/www/mira/dist;
    client_max_body_size 3g;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;

    location ^~ /api/admin/ {
        proxy_pass http://mira_api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ^~ /api/auth/ {
        proxy_pass http://mira_api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ^~ /api/ { return 404; }
    location ^~ /assets/ { try_files $uri =404; }

    location ~ ^/(admin|login|forgot-password|reset-password) {
        try_files $uri /index.html;
    }

    location / { return 302 /admin; }
}
